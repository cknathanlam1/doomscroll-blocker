name: DoomscrollerBlocker
options:
  bundleIdPrefix: edu.mit.seancs
  deploymentTarget:
    iOS: "26.0"
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
targets:
  DoomscrollerBlocker:
    type: application
    platform: iOS
    sources: [DoomscrollerBlocker]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Doomscroller Blocker
        INFOPLIST_KEY_NSCameraUsageDescription: "Doomscroller Blocker uses the camera to count your push-ups."
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: [DoomscrollerBlockerTests]
  DoomscrollerBlockerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DoomscrollerBlockerTests
        excludes: [RealRecordings]
      # A real iPhone recording (Vision), used to tune the Vision-specific adapter.
      - path: DoomscrollerBlockerTests/RealRecordings
        type: folder
        buildPhase: resources
      # One source of truth for fixtures: the web prototype's own files.
      - path: web-prototype/tests/fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: DoomscrollerBlocker
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
